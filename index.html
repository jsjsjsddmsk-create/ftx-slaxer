<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝑳𝑹𝒁 𝑿 !𝑴𝑨𝑹𝑨𝑾𝑨𝑵 | Core System</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --red: #ff003c; --bg: #020000; --text: #e0e0e0; --glass: rgba(10, 0, 5, 0.75); --border: rgba(255, 0, 60, 0.4); --cyan: #00ffcc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fira Code', monospace; }
        body { background-color: var(--bg); background-image: url('YOUR_DIRECT_IMAGE_LINK_HERE'); background-size: cover; background-position: center; background-attachment: fixed; color: var(--text); min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow-x: hidden; overflow-y: auto; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -2; backdrop-filter: blur(5px); }
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.25; pointer-events: none; }
        body::after { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.5) 51%); background-size: 100% 4px; z-index: 10; pointer-events: none; opacity: 0.6; }
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; z-index: 100; padding: 20px; transition: opacity 0.5s ease; }
        .login-box { background: var(--glass); border: 1px solid var(--border); padding: 40px 30px; width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 25px; text-align: center; clip-path: polygon(0 0, 100% 0, 100% 90%, 95% 100%, 0 100%); backdrop-filter: blur(15px); box-shadow: 0 0 50px rgba(255, 0, 60, 0.1); margin: auto; }
        .logo-glitch { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 800; text-transform: uppercase; color: #fff; text-shadow: 0 0 10px var(--red); position: relative; letter-spacing: 2px; }
        .input-group input { width: 100%; padding: 20px; background: rgba(0,0,0,0.8); border: 1px solid var(--border); color: var(--red); font-family: 'Fira Code', monospace; font-size: 1.1rem; text-align: center; outline: none; transition: 0.3s; border-radius: 4px; }
        .input-group input:focus { border-color: var(--red); box-shadow: 0 0 20px rgba(255, 0, 60, 0.4); }
        .login-btn { background: var(--red); color: #000; border: none; padding: 20px; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; cursor: pointer; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%); transition: 0.3s; }
        .login-btn:hover { background: #fff; box-shadow: 0 0 40px var(--red); }
        #mainApp { display: none; flex-direction: column; min-height: 100vh; z-index: 20; width: 100%; }
        header { padding: 30px 20px 20px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border); margin: 0 20px; flex-wrap: wrap; gap: 10px; }
        header h1 { font-family: 'Syne', sans-serif; font-size: 2rem; color: #fff; text-shadow: 0 0 10px var(--red); }
        .status-indicator { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--red); font-weight: 600; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; border: 1px solid var(--border); }
        .blink-dot { width: 10px; height: 10px; background: var(--red); border-radius: 50%; box-shadow: 0 0 10px var(--red); animation: blink 1s infinite alternate; }
        .tabs-nav { display: flex; justify-content: center; gap: 10px; margin: 20px auto 0; padding: 0 20px; flex-wrap: wrap; }
        .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 12px 30px; font-size: 1rem; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: 0.3s; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%); font-family: 'Syne', sans-serif; }
        .tab-btn.active { background: rgba(255, 0, 60, 0.15); color: var(--red); border-color: var(--red); box-shadow: 0 0 20px rgba(255, 0, 60, 0.3); }
        .tab-btn.logout-tab { border-color: #555; color: #888; }
        .tab-btn.logout-tab:hover { border-color: var(--red); color: var(--red); }
        .tab-content { display: none; flex: 1; padding: 20px; gap: 20px; max-width: 1600px; margin: 0 auto; width: 100%; animation: fadeIn 0.5s ease; }
        .tab-content.active { display: grid; grid-template-columns: 1fr; }
        @media (min-width: 900px) { .tab-content.active { grid-template-columns: 1fr 1fr; padding: 40px; } }
        #logoutTab.active { display: flex; justify-content: center; align-items: center; }
        .control-section { display: flex; flex-direction: column; gap: 20px; }
        .glass-box { background: var(--glass); border: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; gap: 20px; clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%); backdrop-filter: blur(10px); }
        .input-area { padding: 5px; display: flex; flex-direction: column; gap: 5px; background: var(--glass); border: 1px solid var(--border); clip-path: polygon(0 0, 100% 0, 97% 100%, 0% 100%); }
        .input-area input { background: rgba(0,0,0,0.8); border: none; padding: 18px 20px; color: #fff; font-size: 1.1rem; outline: none; }
        .action-btn { background: var(--red); color: #000; border: none; padding: 18px; font-size: 1rem; font-weight: 700; text-transform: uppercase; cursor: pointer; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0% 100%); transition: 0.3s; }
        .action-btn:hover { background: #fff; box-shadow: 0 0 30px var(--red); }
        .stat-row { display: flex; flex-direction: column; gap: 8px; }
        .stat-info { display: flex; justify-content: space-between; font-size: 0.85rem; text-transform: uppercase; }
        .stat-val { color: var(--red); font-weight: 700; }
        .stat-bar-bg { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 0, 60, 0.2); }
        .stat-bar-fill { height: 100%; width: 0%; background: var(--red); box-shadow: 0 0 15px var(--red); transition: width 0.6s ease; }
        .total-download-box { margin-top: 10px; background: rgba(255, 0, 60, 0.1); border: 1px solid var(--red); padding: 15px; display: flex; justify-content: space-between; align-items: center; clip-path: polygon(0 0, 100% 0, 100% 100%, 5% 100%); }
        .total-download-box span:last-child { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: #fff; }
        .download-actions { display: none; gap: 10px; margin-top: 15px; }
        .download-actions.show { display: flex; }
        .dl-btn { flex: 1; background: rgba(0,0,0,0.6); border: 1px solid var(--cyan); color: var(--cyan); padding: 12px; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dl-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }
        .dl-btn.zip-btn { border-color: var(--red); color: var(--red); }
        .dl-btn.zip-btn:hover { background: var(--red); box-shadow: 0 0 20px var(--red); }
        .code-viewer-container { background: var(--glass); border: 1px solid var(--border); clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%); overflow: hidden; }
        .code-viewer-header { background: rgba(255, 0, 60, 0.15); padding: 10px 15px; font-size: 0.8rem; color: var(--red); font-weight: 700; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .code-viewer-content { padding: 15px; color: var(--cyan); font-size: 0.85rem; line-height: 1.5; max-height: 250px; overflow-y: auto; white-space: pre-wrap; background: #030000; }
        .log-section { display: flex; flex-direction: column; min-height: 400px; background: var(--glass); border: 1px solid var(--border); clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%); }
        .log-header { padding: 15px 20px; background: rgba(255, 0, 60, 0.15); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--red); font-size: 0.8rem; }
        .log-content { flex: 1; padding: 20px; overflow-y: auto; font-size: 0.9rem; line-height: 1.6; display: flex; flex-direction: column; gap: 8px; }
        .log-line.success { color: var(--cyan); } .log-line.error { color: var(--red); } .log-line.info { color: #ffaa00; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .input-row { display: flex; gap: 10px; }
        .custom-select, .custom-input { flex: 1; background: rgba(0,0,0,0.8); border: 1px solid var(--border); color: #fff; padding: 15px; outline: none; }
        .toggle-container { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); border: 1px solid var(--border); padding: 15px; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--red); box-shadow: 0 0 15px var(--red); }
        input:checked + .slider:before { transform: translateX(26px); }
        .copy-btn { background: var(--cyan); color: #000; border: none; padding: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; margin-top: 10px; }
        .copy-btn:hover { background: #fff; box-shadow: 0 0 20px var(--cyan); }
        .logout-container { background: var(--glass); border: 2px solid var(--red); padding: 50px 40px; text-align: center; max-width: 600px; width: 100%; clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%); }
        .warning-icon { font-size: 4rem; color: var(--red); margin-bottom: 20px; animation: pulse 1.5s infinite alternate; }
        .logout-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 30px; }
        .btn-yes, .btn-no { padding: 15px 40px; font-size: 1.2rem; font-weight: 800; cursor: pointer; border: none; }
        .btn-yes { background: var(--red); color: #000; } .btn-no { background: transparent; color: var(--cyan); border: 2px solid var(--cyan); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes pulse { from { text-shadow: 0 0 10px var(--red); } to { text-shadow: 0 0 30px var(--red); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <div id="loginScreen">
        <div class="login-box">
            <div class="logo-glitch">𝑳𝑹𝒁 𝑿 !𝑴𝑨𝑹𝑨𝑾𝑨𝑵</div>
            <div class="input-group"><input type="text" id="apiKeyInput" placeholder="Paste API Key or Script here..."></div>
            <button id="continueBtn" class="login-btn">CONTINUE</button>
        </div>
    </div>

    <div id="mainApp">
        <header>
            <h1>𝑳𝑹𝒁 𝑿 !𝑴𝑨𝑹𝑨𝑾𝑨𝑵</h1>
            <div class="status-indicator"><div class="blink-dot"></div><span>SERVER ONLINE</span></div>
        </header>

        <nav class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('mainTab', this)">Main</button>
            <button class="tab-btn" onclick="switchTab('generatorTab', this)">Generator</button>
            <button class="tab-btn logout-tab" onclick="switchTab('logoutTab', this)">Logout</button>
        </nav>

        <div id="mainTab" class="tab-content active">
            <section class="control-section">
                <div class="input-area">
                    <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off">
                    <button class="action-btn" id="confirmBtn">Execute Target</button>
                </div>
                <div class="glass-box">
                    <div class="stat-row"><div class="stat-info"><span>Pages</span><span class="stat-val" id="pagesCount">0</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" id="pagesBar"></div></div></div>
                    <div class="stat-row"><div class="stat-info"><span>Scripts</span><span class="stat-val" id="scriptsCount">0</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" id="scriptsBar"></div></div></div>
                    <div class="stat-row"><div class="stat-info"><span>Assets</span><span class="stat-val" id="assetsCount">0</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" id="assetsBar"></div></div></div>
                    <div class="total-download-box"><span>Total Size</span><span><span id="kbCount">0.0</span> KB</span></div>
                    <div class="download-actions" id="downloadActions">
                        <button class="dl-btn" onclick="downloadTxt()" id="dlTxtBtn">download.txt</button>
                        <button class="dl-btn zip-btn" onclick="downloadZip()" id="dlZipBtn">download.zip</button>
                    </div>
                </div>
                <div class="code-viewer-container">
                    <div class="code-viewer-header"><span>[ EXPLOIT PAYLOAD SCRIPT ]</span><span id="codeStatus">READY</span></div>
                    <div class="code-viewer-content" id="rawCodeOutput">local appkey = "WAITING_FOR_TARGET..."</div>
                </div>
            </section>
            <section class="log-section">
                <div class="log-header"><span>[ LIVE DATA STREAM ]</span><span>ENCRYPTED</span></div>
                <div class="log-content" id="logContainer"><div class="log-line success">> System Ready...</div></div>
            </section>
        </div>

        <div id="generatorTab" class="tab-content">
            <section class="control-section">
                <div class="glass-box">
                    <h2 style="color:#fff; border-bottom: 1px solid var(--border); padding-bottom: 10px;">KEY GENERATOR</h2>
                    <div class="form-group"><label>DURATION</label><div class="input-row"><select class="custom-select" id="durationSelect"><option value="DAYS">DAYS</option><option value="HOURS">HOURS</option><option value="LIFETIME">LIFETIME</option></select><input type="number" id="durationAmount" class="custom-input" min="1" value="1"></div></div>
                    <div class="form-group"><label>HWID LOCK</label><div class="toggle-container"><span>Enable?</span><label class="switch"><input type="checkbox" id="hwidToggle"><span class="slider"></span></label></div></div>
                    <button class="action-btn" onclick="generateKey()">GENERATE KEY</button>
                    <div id="keyResultArea" style="display:none; margin-top: 15px;"><div class="code-viewer-content" id="generatedCodeDisplay"></div><button id="copyKeyBtn" class="copy-btn">COPY SCRIPT</button></div>
                </div>
            </section>
            <section class="control-section">
                <div class="glass-box">
                    <h2 style="color: var(--red); border-bottom: 1px solid var(--border); padding-bottom: 10px;">BLACKLIST</h2>
                    <div class="input-row"><input type="text" id="blInput" class="custom-input" placeholder="appkey=..." style="flex: 2;"><button class="action-btn" onclick="addBlacklist()" style="flex: 1; padding: 15px;">BLACKLIST</button></div>
                    <div class="unblacklist-list" id="blList" style="margin-top: 15px; max-height: 200px; overflow-y: auto;"></div>
                </div>
            </section>
        </div>

        <div id="logoutTab" class="tab-content">
            <div class="logout-container">
                <div class="warning-icon">⚠️</div>
                <h2 style="color: #fff; margin-bottom: 10px;">Warning!!</h2>
                <p>Are u sure to logout?</p>
                <div class="logout-buttons">
                    <button class="btn-yes" onclick="doLogout()">YES</button>
                    <button class="btn-no" onclick="switchTab('mainTab', document.querySelector('.tab-btn'))">NO</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas'), ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*", fontSize = 16, columns = canvas.width / fontSize, drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
        function drawMatrix() { ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#ff003c"; ctx.font = fontSize + "px monospace"; for (let i = 0; i < drops.length; i++) { const text = letters[Math.floor(Math.random() * letters.length)]; ctx.fillText(text, i * fontSize, drops[i] * fontSize); if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0; drops[i]++; } }
        setInterval(drawMatrix, 50);

        const loginScreen = document.getElementById('loginScreen'), mainApp = document.getElementById('mainApp'), continueBtn = document.getElementById('continueBtn'), logContainer = document.getElementById('logContainer');
        function typeLog(msg, type = 'info') { const div = document.createElement('div'); div.className = `log-line ${type}`; logContainer.appendChild(div); logContainer.scrollTop = logContainer.scrollHeight; let i = 0; function type() { if (i < msg.length) { div.innerText += msg.charAt(i); i++; setTimeout(type, 15); } } type(); }

        continueBtn.addEventListener('click', async () => {
            let rawKey = document.getElementById('apiKeyInput').value.trim(); if (!rawKey) return;
            let keyToCheck = rawKey.includes('http') ? rawKey.match(/http[^"\s]+/)[0] : rawKey;
            continueBtn.innerText = "AUTHENTICATING...";
            try {
                const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: keyToCheck }) });
                const data = await res.json();
                if (res.ok) { continueBtn.innerText = "ACCESS GRANTED"; continueBtn.style.background = "var(--cyan)"; setTimeout(() => { loginScreen.style.display = 'none'; mainApp.style.display = 'flex'; }, 1000); }
                else throw new Error(data.error);
            } catch (err) { continueBtn.innerText = "ACCESS DENIED"; continueBtn.style.background = "var(--red)"; continueBtn.style.color = "#fff"; setTimeout(() => { continueBtn.innerText = "CONTINUE"; continueBtn.style.background = ""; continueBtn.style.color = ""; }, 2000); }
        });

        function switchTab(tabId, btn) { document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(tabId).classList.add('active'); btn.classList.add('active'); if (tabId === 'generatorTab') loadBlacklist(); }
        function doLogout() { location.reload(); }

        let realPageText = "", realTargetName = "";
        document.getElementById('confirmBtn').addEventListener('click', async () => {
            let url = document.getElementById('urlInput').value.trim(); if(!url) return; if(!url.startsWith('http')) url = 'https://' + url;
            document.getElementById('confirmBtn').disabled = true; document.getElementById('confirmBtn').innerText = "Analyzing..."; logContainer.innerHTML = ''; realTargetName = url.replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
            try {
                const response = await fetch('/api/site', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url }) });
                const data = await response.json(); if (!response.ok) throw new Error(data.error);
                realPageText = data.page.text; 
                let scriptsCount = data.assets.filter(a => a.url.includes('.js')).length, kbSize = (new Blob([realPageText]).size / 1024).toFixed(2);
                document.getElementById('pagesCount').innerText = "1"; document.getElementById('pagesBar').style.width = '100%';
                document.getElementById('scriptsCount').innerText = scriptsCount; document.getElementById('scriptsBar').style.width = '100%';
                document.getElementById('assetsCount').innerText = data.assets.length; document.getElementById('assetsBar').style.width = '100%';
                document.getElementById('kbCount').innerText = kbSize;
                document.getElementById('dlTxtBtn').innerText = `${realTargetName}_deobf_by_!Lrz_x_!marawan.txt`; document.getElementById('dlZipBtn').innerText = `${realTargetName}_deobf_by_!Lrz_x_!marawan.zip`;
                const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
                document.getElementById('rawCodeOutput').innerHTML = `local appkey = "appkey=LRZ_X_MARAWAN_${randomStr}_LOCK"\n-- Target: ${url}\n-- Status: Active | HWID: LOCKED\nloadstring(game:HttpGet("http://lrz-x-marawan.com/loader.lua"))()`;
                document.getElementById('codeStatus').innerText = "PAYLOAD READY"; document.getElementById('downloadActions').classList.add('show'); typeLog("Extraction Complete. Ready for download.", "success");
            } catch (error) { typeLog(`[ERROR] ${error.message}`, 'error'); } finally { document.getElementById('confirmBtn').disabled = false; document.getElementById('confirmBtn').innerText = "Execute Target"; }
        });

        async function downloadTxt() { if (!realPageText) return; const blob = new Blob([realPageText], { type: "text/plain" }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${realTargetName}_deobf_by_!Lrz x !marawan.txt`; a.click(); }
        
        // التعديل الجديد: بنجيب كود السيرفر الحقيقي من السيرفر نفسه عشان نضعه في الـ ZIP
        async function downloadZip() {
            if (!realPageText) return;
            const btn = document.getElementById('dlZipBtn'); btn.innerText = "PACKAGING...";
            
            try {
                // بنسأل السيرفر يدينا كوده الحقيقي
                const srcRes = await fetch('/api/my-source');
                const srcData = await srcRes.json();

                const zip = new JSZip();
                // بنحط الكود اللي جبناه من السيرفر
                zip.file("server.js", srcData.serverCode);
                zip.file("package.json", srcData.packageCode);
                // ملف الواجهة الحالي
                zip.file("index.html", document.documentElement.outerHTML);
                // الكود المسحوب من الموقع
                zip.file(`${realTargetName}_source.txt`, realPageText);
                zip.file("readme.md", `# LRZ X MARAWAN\nTarget: ${realTargetName}\nSize: ${(new Blob([realPageText]).size / 1024).toFixed(2)} KB`);

                const content = await zip.generateAsync({ type: "blob" });
                const a = document.createElement('a'); a.href = URL.createObjectURL(content); a.download = `${realTargetName}_deobf_by_!Lrz x !marawan.zip`; a.click();
                btn.innerText = `${realTargetName}_deobf_by_!Lrz_x_!marawan.zip`;
            } catch (err) {
                typeLog(`[ZIP ERROR] ${err.message}`, 'error');
                btn.innerText = "ERROR";
            }
        }

        async function generateKey() {
            const type = document.getElementById('durationSelect').value, amount = document.getElementById('durationAmount').value, hwid = document.getElementById('hwidToggle').checked;
            const res = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type, amount, hwid }) });
            const data = await res.json();
            if (data.success) { document.getElementById('keyResultArea').style.display = 'block'; document.getElementById('generatedCodeDisplay').innerHTML = `local appkey = "${data.key}"\n-- HWID: ${hwid ? 'LOCKED' : 'UNLOCKED'}`; document.getElementById('copyKeyBtn').onclick = () => navigator.clipboard.writeText(data.key); }
        }
        async function addBlacklist() { const key = document.getElementById('blInput').value.trim(); if (!key) return; await fetch('/api/blacklist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) }); document.getElementById('blInput').value = ''; loadBlacklist(); }
        async function loadBlacklist() { const res = await fetch('/api/blacklist'); const data = await res.json(); const list = document.getElementById('blList'); list.innerHTML = ''; if (data.blacklist.length === 0) list.innerHTML = '<div style="color: #666; font-size: 0.8rem;">No keys blacklisted.</div>'; data.blacklist.forEach(k => { list.innerHTML += `<div style="display:flex; justify-content:space-between; background:rgba(255,0,60,0.1); padding:10px; margin-bottom:5px; border:1px solid var(--border); font-size:0.8rem;"><span>${k}</span><button onclick="removeBlacklist('${k}')" style="background:none; border:none; color:#fff; cursor:pointer;">REMOVE</button></div>`; }); }
        async function removeBlacklist(key) { await fetch('/api/unblacklist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) }); loadBlacklist(); }
    </script>
</body>
</html>
