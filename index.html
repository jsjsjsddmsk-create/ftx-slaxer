    <script type="text/plain" id="server-js-code">
// PURE DUMPER HTML V24 backend — Node.js 20+
'use strict';
const http = require('node:http');
const fs = require('node:fs');
const path = require('node:path');
const dns = require('node:dns').promises;
const net = require('node:net');

const PORT = Number(process.env.PORT || 3000);
const ROOT = __dirname;
const MAX_BODY = 4096;
const MAX_RESPONSE = 3 * 1024 * 1024;
const TIMEOUT_MS = 15000;
const rate = new Map();

function isPrivateIPv4(ip) {
  const p = ip.split('.').map(Number);
  if (p.length !== 4 || p.some(n => !Number.isInteger(n) || n < 0 || n > 255)) return true;
  const [a,b] = p;
  return a===0 || a===10 || a===127 || a>=224 ||
    (a===100 && b>=64 && b<=127) || (a===169 && b===254) ||
    (a===172 && b>=16 && b<=31) || (a===192 && b===168) ||
    (a===192 && b===0) || (a===198 && (b===18 || b===19));
}

function isPrivateIPv6(ip) {
  const x = ip.toLowerCase().split('%')[0];
  return x==='::' || x==='::1' || x.startsWith('fc') || x.startsWith('fd') ||
    /^fe[89ab]/.test(x) || x.startsWith('ff') || x.startsWith('::ffff:');
}

async function assertPublicHost(url) {
  if (!['http:','https:'].includes(url.protocol)) throw new Error('Only HTTP and HTTPS URLs are allowed.');
  if (url.username || url.password) throw new Error('URLs containing credentials are not allowed.');
  const host = url.hostname.toLowerCase().replace(/^\[|\]$/g,'');
  if (!host || host==='localhost' || host.endsWith('.localhost') || host.endsWith('.local'))
    throw new Error('Blocked host: destination must be a public internet host.');
  const kind = net.isIP(host);
  if (kind===4 && isPrivateIPv4(host)) throw new Error('Blocked host: private or reserved IP address.');
  if (kind===6 && isPrivateIPv6(host)) throw new Error('Blocked host: private or reserved IPv6 address.');
  if (!kind) {
    const records = await dns.lookup(host, {all:true, verbatim:true});
    if (!records.length || records.some(r => r.family===4 ? isPrivateIPv4(r.address) : isPrivateIPv6(r.address)))
      throw new Error('Blocked host: DNS resolved to a private or reserved address.');
  }
}

function limited(req, res) {
  const ip = req.socket.remoteAddress || 'unknown';
  const now = Date.now(), entry = rate.get(ip) || {start:now,count:0};
  if (now-entry.start > 60000) { entry.start=now; entry.count=0; }
  entry.count++; rate.set(ip,entry);
  if (entry.count > 45) {
    send(res,429,{error:'Too many requests. Wait one minute and retry.'});
    return true;
  }
  return false;
}

function send(res,status,obj) {
  const body=JSON.stringify(obj);
  res.writeHead(status,{
    'Content-Type':'application/json; charset=utf-8',
    'Cache-Control':'no-store',
    'X-Content-Type-Options':'nosniff'
  });
  res.end(body);
}

async function fetchPublic(raw) {
  let current = new URL(raw);
  for (let hop=0; hop<=4; hop++) {
    await assertPublicHost(current);
    const controller = new AbortController();
    const timer=setTimeout(()=>controller.abort(),TIMEOUT_MS);
    let response;
    try {
      response=await fetch(current,{
        method:'GET',
        redirect:'manual',
        signal:controller.signal,
        headers:{
          'User-Agent':'PURE-DUMPER-HTML/23 (public asset inspector)',
          'Accept':'text/html,application/javascript,text/css,application/json,*/*;q=0.8'
        }
      });
    } finally {
      clearTimeout(timer);
    }

    if ([301,302,303,307,308].includes(response.status)) {
      if (hop===4) throw new Error('Too many redirects (limit: 4).');
      const loc=response.headers.get('location');
      if (!loc) throw new Error('Redirect response did not include a Location header.');
      current=new URL(loc,current);
      continue;
    }

    if (!response.ok) {
      const e=new Error(`Remote server returned HTTP ${response.status}.`);
      e.status=response.status;
      throw e;
    }

    const declared=Number(response.headers.get('content-length')||0);
    if (declared>MAX_RESPONSE) throw new Error('Remote response exceeds 3 MB limit.');

    const reader=response.body.getReader();
    const chunks=[];
    let total=0;

    while (true) {
      const {done,value}=await reader.read();
      if(done)break;
      total+=value.byteLength;
      if(total>MAX_RESPONSE) {
        await reader.cancel();
        throw new Error('Remote response exceeds 3 MB limit.');
      }
      chunks.push(Buffer.from(value));
    }

    const text=Buffer.concat(chunks).toString('utf8');
    return {
      text,
      status:response.status,
      finalUrl:current.href,
      contentType:response.headers.get('content-type')||''
    };
  }
  throw new Error('Unable to complete redirect chain.');
}

const server=http.createServer(async(req,res)=>{
  if(req.method==='GET' && req.url==='/api/health')
    return send(res,200,{
      ok:true,
      service:'PURE DUMPER HTML V24',
      node:process.version
    });

  if(req.method==='POST' && req.url==='/api/fetch'){
    if(limited(req,res))return;
    let body='';

    req.on('data',chunk=>{
      body+=chunk;
      if(body.length>MAX_BODY){req.destroy();}
    });

    req.on('end',async()=>{
      try {
        const parsed=JSON.parse(body||'{}');
        if(typeof parsed.url!=='string'||parsed.url.length>2048)
          return send(res,400,{error:'Provide a valid URL (maximum 2048 characters).'});

        let url;
        try {
          url=new URL(parsed.url);
        } catch {
          return send(res,400,{error:'Invalid URL.'});
        }

        const result=await fetchPublic(url.href);
        send(res,200,result);
      } catch(e) {
        const status=e.status||(/Only HTTP|credentials|Blocked host|Invalid URL/i.test(e.message)?400:502);
        send(res,status,{
          error:e.name==='AbortError'?'Remote request timed out.':e.message,
          detail:e.cause?.code||''
        });
      }
    });
    return;
  }

  if(req.method==='GET'){
    const pathname=decodeURIComponent((req.url||'/').split('?')[0]);
    const target=pathname==='/'?'index.html':pathname.replace(/^\/+/,'');
    const file=path.resolve(ROOT,target);

    if(!file.startsWith(ROOT+path.sep)){
      res.writeHead(403);
      return res.end('Forbidden');
    }

    fs.readFile(file,(err,data)=>{
      if(err){
        res.writeHead(404);
        return res.end('Not found');
      }

      const ext=path.extname(file);
      const types={
        '.html':'text/html; charset=utf-8',
        '.js':'text/javascript; charset=utf-8',
        '.css':'text/css; charset=utf-8',
        '.txt':'text/plain; charset=utf-8'
      };

      res.writeHead(200,{
        'Content-Type':types[ext]||'application/octet-stream',
        'X-Content-Type-Options':'nosniff'
      });
      res.end(data);
    });
    return;
  }

  res.writeHead(405);
  res.end('Method not allowed');
});

server.listen(PORT,'0.0.0.0',()=>console.log(`PURE DUMPER HTML V24 listening on ${PORT}`));
    </script>

                    <div class="form-group"><label>HWID LOCK</label><div class="toggle-container"><span>Enable?</span><label class="switch"><input type="checkbox" id="hwidToggle"><span class="slider"></span></label></div></div>
                    <button class="action-btn" onclick="generateKey()">GENERATE KEY</button>
                    <div id="keyResultArea" style="display:none; margin-top: 15px;"><div class="code-viewer-content" id="generatedCodeDisplay"></div><button id="copyKeyBtn" class="copy-btn">COPY SCRIPT</button></div>
                </div>
            </section>
            <section class="control-section">
                <div class="glass-box">
                    <h2 style="color: var(--red); border-bottom: 1px solid var(--border); padding-bottom: 10px;">BLACKLIST</h2>
                    <div class="input-row"><input type="text" id="blInput" class="custom-input" placeholder="appkey=..." style="flex: 2;"><button class="action-btn" onclick="addBlacklist()" style="flex: 1; padding: 15px;">BLACKLIST</button></div>
                    <div class="unblacklist-list" id="blList" style="margin-top: 15px; max-height: 200px; overflow-y: auto;"></div>
                </div>
            </section>
        </div>

        <div id="logoutTab" class="tab-content">
            <div class="logout-container">
                <div class="warning-icon">⚠️</div>
                <h2 style="color: #fff; margin-bottom: 10px;">Warning!!</h2>
                <p>Are u sure to logout?</p>
                <div class="logout-buttons">
                    <button class="btn-yes" onclick="doLogout()">YES</button>
                    <button class="btn-no" onclick="switchTab('mainTab', document.querySelector('.tab-btn'))">NO</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Matrix Background
        const canvas = document.getElementById('matrixCanvas'), ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*", fontSize = 16, columns = canvas.width / fontSize, drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
        function drawMatrix() { ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#ff003c"; ctx.font = fontSize + "px monospace"; for (let i = 0; i < drops.length; i++) { const text = letters[Math.floor(Math.random() * letters.length)]; ctx.fillText(text, i * fontSize, drops[i] * fontSize); if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0; drops[i]++; } }
        setInterval(drawMatrix, 50);

        const loginScreen = document.getElementById('loginScreen'), mainApp = document.getElementById('mainApp'), continueBtn = document.getElementById('continueBtn'), logContainer = document.getElementById('logContainer');
        function typeLog(msg, type = 'info') { const div = document.createElement('div'); div.className = `log-line ${type}`; logContainer.appendChild(div); logContainer.scrollTop = logContainer.scrollHeight; let i = 0; function type() { if (i < msg.length) { div.innerText += msg.charAt(i); i++; setTimeout(type, 15); } } type(); }

        // Auth (Frontend only)
        const OWNER_KEY = "!LRZ X !MARAWAN-976&$";
        let validKeys = JSON.parse(localStorage.getItem('validKeys')) || {};
        let blacklistedKeys = JSON.parse(localStorage.getItem('blKeys')) || [];

        window.addEventListener('DOMContentLoaded', () => { if (localStorage.getItem('lrz_session') === 'active') { loginScreen.style.display = 'none'; mainApp.style.display = 'flex'; } });

        continueBtn.addEventListener('click', () => {
            let rawKey = document.getElementById('apiKeyInput').value.trim(); if (!rawKey) return;
            let keyToCheck = rawKey.includes('http') ? rawKey.match(/http[^"\s]+/)[0] : rawKey;
            let isValid = false;

            if (keyToCheck === OWNER_KEY) { isValid = true; } 
            else if (keyToCheck.startsWith("http") && validKeys[keyToCheck] && Date.now() < validKeys[keyToCheck] && !blacklistedKeys.includes(keyToCheck)) { isValid = true; }

            if (isValid) {
                continueBtn.innerText = "AUTHENTICATING..."; continueBtn.style.background = "#ffaa00"; continueBtn.style.color = "#000";
                localStorage.setItem('lrz_session', 'active');
                setTimeout(() => {
                    continueBtn.innerText = "ACCESS GRANTED"; continueBtn.style.background = "var(--cyan)";
                    setTimeout(() => {
                        loginScreen.style.display = 'none';
                        if (keyToCheck.startsWith('http')) {
                            document.getElementById('obfuscationScreen').style.display = 'flex';
                            let text = "THIS APP LINK WAS OBFUSCATED", i = 0;
                            document.getElementById('obfText').innerHTML = '';
                            let int = setInterval(() => {
                                document.getElementById('obfText').innerHTML += text.charAt(i); i++;
                                if (i === text.length) { clearInterval(int); setTimeout(() => { document.getElementById('obfuscationScreen').style.display = 'none'; mainApp.style.display = 'flex'; }, 1500); }
                            }, 50);
                        } else { mainApp.style.display = 'flex'; }
                    }, 800);
                }, 1000);
            } else {
                continueBtn.innerText = "ACCESS DENIED"; continueBtn.style.background = "var(--red)"; continueBtn.style.color = "#fff";
                setTimeout(() => { continueBtn.innerText = "CONTINUE"; continueBtn.style.background = ""; continueBtn.style.color = ""; }, 2000);
            }
        });

        function switchTab(tabId, btn) { document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(tabId).classList.add('active'); btn.classList.add('active'); if (tabId === 'generatorTab') loadBlacklist(); }
        function doLogout() { localStorage.removeItem('lrz_session'); location.reload(); }

        // Main App Logic (Connected to V24 API)
        let realPageText = "", realTargetName = "";
        document.getElementById('confirmBtn').addEventListener('click', async () => {
            let url = document.getElementById('urlInput').value.trim(); if(!url) return; if(!url.startsWith('http')) url = 'https://' + url;
            
            document.getElementById('confirmBtn').disabled = true; document.getElementById('confirmBtn').innerText = "Analyzing..."; 
            logContainer.innerHTML = ''; realTargetName = url.replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
            typeLog(`Connecting to server...`, 'info');

            try {
                // استخدام المسار الجديد /api/fetch
                const response = await fetch('/api/fetch', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ url: url }) 
                });
                
                const data = await response.json(); 
                if (!response.ok) throw new Error(data.error || "Server rejected request");

                realPageText = data.text; 
                
                // حساب الأرقام من الكود اللي رجع
                let scriptsCount = (realPageText.match(/<script/gi) || []).length;
                let assetsCount = (realPageText.match(/<link|<img/gi) || []).length;
                let kbSize = (new Blob([realPageText]).size / 1024).toFixed(2);

                typeLog(`[SUCCESS] Received data from ${url}`, 'success');
                typeLog(`Size: ${kbSize} KB | Scripts: ${scriptsCount} | Assets: ${assetsCount}`, 'info');

                document.getElementById('pagesCount').innerText = "1"; document.getElementById('pagesBar').style.width = '100%';
                document.getElementById('scriptsCount').innerText = scriptsCount; document.getElementById('scriptsBar').style.width = '100%';
                document.getElementById('assetsCount').innerText = assetsCount; document.getElementById('assetsBar').style.width = '100%';
                document.getElementById('kbCount').innerText = kbSize;
                document.getElementById('dlTxtBtn').innerText = `${realTargetName}_deobf_by_!Lrz_x_!marawan.txt`; 
                document.getElementById('dlZipBtn').innerText = `${realTargetName}_deobf_by_!Lrz_x_!marawan.zip`;
                
                const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
                document.getElementById('rawCodeOutput').innerHTML = `local appkey = "appkey=LRZ_X_MARAWAN_${randomStr}_LOCK"\n-- Target: ${url}\n-- Status: Active | HWID: LOCKED\nloadstring(game:HttpGet("http://lrz-x-marawan.com/loader.lua"))()`;
                document.getElementById('codeStatus').innerText = "PAYLOAD READY"; 
                document.getElementById('downloadActions').classList.add('show');
                
            } catch (error) { 
                typeLog(`[ERROR] ${error.message}`, 'error'); 
                document.getElementById('rawCodeOutput').innerText = `-- ERROR: ${error.message}`;
            } finally { 
                document.getElementById('confirmBtn').disabled = false; 
                document.getElementById('confirmBtn').innerText = "Execute Target"; 
            }
        });

        // Download Logic
        async function downloadTxt() { if (!realPageText) return; const blob = new Blob([realPageText], { type: "text/plain" }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${realTargetName}_deobf_by_!Lrz x !marawan.txt`; a.click(); }
        
        async function downloadZip() {
            if (!realPageText) return;
            const btn = document.getElementById('dlZipBtn'); btn.innerText = "PACKAGING...";
            
            try {
                const zip = new JSZip();
                // بنسحب الكود من البلوكات المخفية اللي فوق
                zip.file("server.js", document.getElementById('server-js-code').textContent.trim());
                zip.file("package.json", document.getElementById('package-json-code').textContent.trim());
                zip.file("index.html", document.documentElement.outerHTML);
                zip.file(`${realTargetName}_source.txt`, realPageText);
                zip.file("readme.md", `# LRZ X MARAWAN DUMPER\nTarget: ${realTargetName}\nSize: ${(new Blob([realPageText]).size / 1024).toFixed(2)} KB`);

                const content = await zip.generateAsync({ type: "blob" });
                const a = document.createElement('a'); a.href = URL.createObjectURL(content); a.download = `${realTargetName}_deobf_by_!Lrz x !marawan.zip`; a.click();
                btn.innerText = `${realTargetName}_deobf_by_!Lrz_x_!marawan.zip`;
                typeLog("ZIP file created successfully.", "success");
            } catch (err) {
                typeLog(`[ZIP ERROR] ${err.message}`, "error");
                btn.innerText = "ERROR";
            }
        }

        // Generator & Blacklist (Frontend Logic)
        function generateKey() {
            const type = document.getElementById('durationSelect').value, amount = parseInt(document.getElementById('durationAmount').value) || 1, hwid = document.getElementById('hwidToggle').checked;
            let expiry = Date.now();
            if (type === 'DAYS') expiry += (amount * 86400000);
            else if (type === 'HOURS') expiry += (amount * 3600000);
            else expiry += (99 * 31536000000);
            
            const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
            const hwidTag = hwid ? "LOCK" : "FREE";
            const fullKey = `http://lrz-x-marawan.com/key?auth=LRZ_X_MARAWAN_${randomStr}_${hwidTag}`;
            
            validKeys[fullKey] = expiry;
            localStorage.setItem('validKeys', JSON.stringify(validKeys));
            
            document.getElementById('keyResultArea').style.display = 'block';
            document.getElementById('generatedCodeDisplay').innerHTML = `local appkey = "${fullKey}"\n-- Auth Status: Active | HWID: ${hwid ? 'LOCKED' : 'UNLOCKED'}`;
            document.getElementById('copyKeyBtn').onclick = () => navigator.clipboard.writeText(fullKey);
        }

        function addBlacklist() {
            const key = document.getElementById('blInput').value.trim(); if (!key) return;
            if (!blacklistedKeys.includes(key)) { blacklistedKeys.push(key); localStorage.setItem('blKeys', JSON.stringify(blacklistedKeys)); }
            document.getElementById('blInput').value = ''; loadBlacklist();
        }

        function loadBlacklist() {
            const list = document.getElementById('blList'); list.innerHTML = '';
            if (blacklistedKeys.length === 0) list.innerHTML = '<div style="color: #666; font-size: 0.8rem;">No keys blacklisted.</div>';
            blacklistedKeys.forEach(k => {
                list.innerHTML += `<div style="display:flex; justify-content:space-between; background:rgba(255,0,60,0.1); padding:10px; margin-bottom:5px; border:1px solid var(--border); font-size:0.8rem;"><span>${k}</span><button onclick="removeBlacklist('${k}')" style="background:none; border:none; color:#fff; cursor:pointer;">REMOVE</button></div>`;
            });
        }

        function removeBlacklist(key) { blacklistedKeys = blacklistedKeys.filter(k => k !== key); localStorage.setItem('blKeys', JSON.stringify(blacklistedKeys)); loadBlacklist(); }
    </script>
</body>
</html>
